name: sabory
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+3

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1

  # Generar reportes Excel
  excel: ^4.0.6

  # Descargar/guardar el Excel en Web y Android
  file_saver: ^0.6.0
  
  # Compartir/guardar reportes en Android
  share_plus: ^12.0.1

  # Carpeta temporal para crear el Excel en Android
  path_provider: ^2.1.5

    # Seleccionar un respaldo para restaurarlo
  file_picker: ^10.3.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_appSabory.png"
  min_sdk_android: 21